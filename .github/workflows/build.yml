name: Build firmware

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Cache dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.platformio/lib
            ~/.platformio/packages
            ~/.platformio/platforms
            .pio/libdeps
            .pio/build/*/lib*
            .pio/build/*/FrameworkArduino
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini', 'platformio.lock') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Create CI configuration
        run: cp include/secrets.h.example include/secrets.h

      - name: Build firmware
        run: pio run
